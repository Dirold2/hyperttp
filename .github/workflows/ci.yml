name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm pack ./dist --dry-run

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  node-runtime:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and integration tests
        run: npm run test

  bun-runtime:
    name: Bun runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun smoke test
        run: >-
          bun --eval '
          const { HyperClient } = await import("./src/index.ts");
          const transport = {
            protocols: ["rest"],
            execute: async (request) => ({
              status: 200,
              headers: { "content-type": "application/json" },
              url: request.url,
              body: new TextEncoder().encode("{\"runtime\":\"bun\"}"),
            }),
          };
          const client = new HyperClient({ builtInPlugins: false }, transport);
          const response = await core.rest.get("https://example.test/");
          if (response.data?.runtime !== "bun") throw new Error("Bun smoke test failed");
          await core.destroy();
          '

  deno-runtime:
    name: Deno runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Build package
        run: npm run build

      - name: Check built public entry
        run: deno check --node-modules-dir=auto --minimum-dependency-age=0 dist/index.js

      - name: Run Deno smoke test
        run: >-
          deno eval --node-modules-dir=auto --minimum-dependency-age=0 '
          const { HyperClient } = await import("./dist/index.js");
          const transport = {
            protocols: ["rest"],
            execute: async (request) => ({
              status: 200,
              headers: { "content-type": "application/json" },
              url: request.url,
              body: new TextEncoder().encode("{\"runtime\":\"deno\"}"),
            }),
          };
          const client = new HyperClient({ builtInPlugins: false }, transport);
          const response = await core.rest.get("https://example.test/");
          if (response.data?.runtime !== "deno") throw new Error("Deno smoke test failed");
          await core.destroy();
          '

  browser-bundle:
    name: Browser bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bundle public entry for browser
        run: >-
          bunx esbuild src/index.ts
          --bundle
          --platform=browser
          --format=esm
          --outfile=/tmp/hyperttp-browser.js

  package-consumer:
    name: Published package smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Create package tarball
        run: npm pack ./dist --pack-destination /tmp

      - name: Install tarball in a clean project
        working-directory: /tmp
        run: |
          mkdir hyperttp-consumer
          cd hyperttp-consumer
          npm init --yes
          npm install ../hyperttp-*.tgz typescript@^7

      - name: Import public entry points and execute a request
        working-directory: /tmp/hyperttp-consumer
        run: >-
          node --input-type=module --eval '
          const { HyperClient } = await import("hyperttp");
          await import("hyperttp");
          const transport = {
            protocols: ["rest"],
            execute: async (request) => ({
              status: 200,
              headers: { "content-type": "application/json" },
              url: request.url,
              body: new TextEncoder().encode("{\"installed\":true}"),
            }),
          };
          const client = new HyperClient({ builtInPlugins: false }, transport);
          const response = await core.rest.get("https://example.test/");
          if (response.data?.installed !== true) throw new Error("Tarball runtime failed");
          await core.destroy();
          '

      - name: Compile consumer TypeScript
        working-directory: /tmp/hyperttp-consumer
        run: |
          cat > index.ts <<'EOF'
          import { HyperClient } from "hyperttp";
          import type { RestRequestOptions } from "hyperttp";

          const options: RestRequestOptions = { timeout: 1000 };
          const core = new HyperClient();
          void core.rest.get("https://example.test", options);
          EOF
          ./node_modules/.bin/tsc index.ts \
            --noEmit \
            --strict \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --skipLibCheck
