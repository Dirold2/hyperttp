name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test -- --coverage

      - name: Build package
        run: npm run build

      - name: Check package contents
        run: npm pack . --dry-run --ignore-scripts

      - name: Upload build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist
          if-no-files-found: error

  node-runtime:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run unit and integration tests
        run: npm run test

  bun-runtime:
    name: Bun runtime
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run built Bun smoke test
        run: npm run smoke:bun

  deno-runtime:
    name: Deno runtime
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x

      - name: Check built public entry
        run: deno check --no-config --no-lock --node-modules-dir=manual dist/index.js

      - name: Run built Deno smoke test
        run: npm run smoke:deno

  browser-bundle:
    name: Browser bundle
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Run built browser smoke without Node polyfills or externals
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome)"
          test -n "$CHROMIUM_PATH"
          npm run smoke:browser

  package-consumer:
    name: Installed package Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24, 26]
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org

      - name: Download build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Create package tarball
        run: npm pack . --ignore-scripts --pack-destination /tmp

      - name: Install tarball in a clean project
        working-directory: /tmp
        run: |
          mkdir hyperttp-consumer
          cd hyperttp-consumer
          npm init --yes
          npm pkg set type=module
          npm install ../hyperttp-*.tgz typescript@^7 @types/node@22

      - name: Import public entry points and execute a request
        working-directory: /tmp/hyperttp-consumer
        run: >-
          node --input-type=module --eval '
          const { HyperClient } = await import("hyperttp");
          await import("hyperttp");
          const transport = {
            protocols: ["rest"],
            execute: async (request) => ({
              status: 200,
              headers: { "content-type": "application/json" },
              url: request.url,
              body: new TextEncoder().encode("{\"installed\":true}"),
            }),
          };
          const client = new HyperClient({}, transport);
          const response = await client.rest.get("https://example.test/");
          if (response.status !== 200) throw new Error("Tarball runtime failed");
          await client.destroy();
          '

      - name: Compile consumer TypeScript
        working-directory: /tmp/hyperttp-consumer
        run: |
          cat > index.ts <<'EOF'
          import { HyperClient } from "hyperttp";
          import type { RestRequestOptions } from "hyperttp";

          const options: RestRequestOptions = { timeout: 1000 };
          const client = new HyperClient();
          const server = client.server(0, { services: { find: (id: string) => id } });
          server.rest.get("/users/:id", ({ params, services }) => ({ body: services.find(params.id) }));
          void client.rest.get("https://example.test", options);
          EOF
          ./node_modules/.bin/tsc index.ts \
            --noEmit \
            --strict \
            --target ES2022 \
            --module NodeNext \
            --moduleResolution NodeNext \
            --types node
