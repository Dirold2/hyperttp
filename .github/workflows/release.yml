name: Publish npm release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release commit
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Download validated build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist

      - name: Verify release version and npm CLI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, appendFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const source = JSON.parse(readFileSync("package.json", "utf8"));
          const built = JSON.parse(readFileSync("dist/package.json", "utf8"));
          if (source.name !== "hyperttp" || built.name !== source.name || built.version !== source.version) {
            throw new Error("Source and validated build package identity do not match");
          }
          if (process.env.RELEASE_TAG !== `v${source.version}`) {
            throw new Error("Release tag must equal v + package.json version");
          }
          const prerelease = source.version.includes("-");
          if (prerelease !== (process.env.RELEASE_PRERELEASE === "true")) {
            throw new Error("GitHub prerelease flag must match the package version");
          }
          const npm = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor] = npm.split(".").map(Number);
          if (major < 11 || (major === 11 && minor < 5)) {
            throw new Error("npm Trusted Publishing requires npm >= 11.5.1; update the runner CLI");
          }
          if (major === 11 && minor === 5 && Number(npm.split(".")[2]) < 1) {
            throw new Error("npm Trusted Publishing requires npm >= 11.5.1");
          }
          appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${prerelease ? "next" : "latest"}\n`);
          EOF

      - name: Check package contents
        run: npm pack ./dist --dry-run --ignore-scripts

      - name: Publish validated artifact with OIDC
        run: npm publish ./dist --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG"
